<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miscellaneous Inventory - Product Management</title>
    <link rel="stylesheet" href="./data_management_styles/css/styles.css">
</head>

<body>
    <!-- Botón de regreso -->
    <a href="index.html" class="back-link">← Go to Home</a>

    <header>
        <h1>Inventory Management</h1>
        <p id="selectOption">Select an option to manage the miscellaneous products</p>
    </header>

    <!-- Menú de navegación principal -->
    <nav id="mainMenu">
        <button class="menu-btn" onclick="showSection('registerSection')">
            <span class="icon">📦</span>
            <span>Register Product</span>
        </button>
        <button class="menu-btn" onclick="showSection('searchSection')">
            <span class="icon">🔍</span>
            <span>Search Product</span>
        </button>
    </nav>

    <!-- Sección: Registrar Producto -->
    <section id="registerSection" class="content-section">
        <h2>Register a New Product</h2>
        <form id="productForm">
            <fieldset class="form-group">
                <label for="prodName">Product's Name</label>
                <input type="text" id="prodName" placeholder="Ex: Lined Notebook" required>
            </fieldset>

            <fieldset class="form-group">
                <label for="prodPrice">Price ($)</label>
                <input type="number" id="prodPrice" placeholder="Ex: 5500" required>
            </fieldset>

            <fieldset class="form-group">
                <label for="prodCategory">Category</label>
                <select id="prodCategory" required>
                    <option value="">Select a Category</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Office supplies">Office supplies</option>
                    <option value="Crafts">Crafts</option>
                    <option value="Technology">Technology</option>
                    <option value="Others">Others</option>
                </select>
            </fieldset>

            <footer class="button-group">
                <button type="submit" class="btn btn-primary">Save Product</button>
                <button type="button" class="btn btn-secondary" onclick="showSection('mainMenu')">Cancel</button>
            </footer>
        </form>
    </section>

    <!-- Sección: Busqueda de Producto -->
    <section id="searchSection" class="content-section">
        <h2>Inventory Search</h2>
        <form id="searchForm">
            <input type="number" id="searchInputID" class="search-input search-field" placeholder="Enter Product ID...">
            <input type="text" id="searchInputName" class="search-input search-field" placeholder="Enter Product Name...">

            <fieldset class="form-group">
                <label for="searchCategory">Category</label>
                <select id="searchCategory" class="search-field">
                    <option value="">Select a Category</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Office supplies">Office supplies</option>
                    <option value="Crafts">Crafts</option>
                    <option value="Technology">Technology</option>
                    <option value="Others">Others</option>
                </select>
            </fieldset>

            <button type="button" class="btn btn-primary" onclick="handleSearch()">Search</button>
        </form>

        <output id="searchResult" class="result-area">
            <p class="placeholder-text">Enter details to see results.</p>
        </output>

        <footer class="button-group">
            <button type="button" class="btn btn-secondary" onclick="showSection('mainMenu')">Go to Menu</button>
        </footer>
    </section>

    <script src="./src/data_management.js"></script>
</body>

</html>
